[package]
name = "bitcoin-inq"
version = "0.0.33"
edition = "2024"
description = "A small CLI for Bitcoin Core and Bitcoin Inquisition workflows"
authors = ["randymcmillan <randymcmillan@protonmail.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/bitcoincore-dev/bitcoin-inq"
repository = "https://github.com/bitcoincore-dev/bitcoin-inq"

[package.metadata.wix]
upgrade-guid = "29702CEF-8585-4AEC-B012-D0E25EB87185"
path-guid = "EB681C20-8782-4D1B-9D99-540309D0837F"
license = false
eula = false

[dependencies]
anyhow = "1"
bitcoin = { version = "0.32", features = ["serde"] }
bitcoincore-rpc = "0.19"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
