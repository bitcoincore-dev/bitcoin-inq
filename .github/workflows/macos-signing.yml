name: macos-signing

on:
  workflow_call:
    inputs:
      raw-artifact-name:
        required: true
        type: string
      final-artifact-name:
        required: true
        type: string
      target-triple:
        required: true
        type: string
    secrets:
      MACOS_DEV_CERTIFICATE:
        required: true
      MACOS_DEV_CERTIFICATE_PWD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true

jobs:
  sign:
    runs-on: macos-14
    steps:
      - name: Download raw artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.raw-artifact-name }}
          path: artifacts
      - name: Locate signing inputs
        id: locate
        shell: bash
        run: |
          root="artifacts"
          pwd
          ls -la "$root" || true
          find "$root" -maxdepth 8 -print | sort || true
          bin="$(find "$root" -type f -path '*/dist/bitcoin-inq' -print -quit)"
          distrib="$(find "$root" -type d -name distrib -print -quit)"
          if [ -z "$bin" ] || [ -z "$distrib" ]; then
            echo "::error title=Downloaded artifact layout unexpected::Unable to locate signing inputs under $root"
            exit 1
          fi
          ls -la "$bin"
          ls -la "$distrib"
          stat "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "distrib=$distrib" >> "$GITHUB_OUTPUT"
      - name: Sign & Notarize Binary
        shell: bash
        run: |
          set -euo pipefail
          bin="${{ steps.locate.outputs.bin }}"
          cert="$RUNNER_TEMP/signcert.p12"

          printf '%s' '${{ secrets.MACOS_DEV_CERTIFICATE }}' | base64 --decode > "$cert"

          security create-keychain -p actions macos-build.keychain
          security default-keychain -s macos-build.keychain
          security unlock-keychain -p actions macos-build.keychain
          security set-keychain-settings -t 3600 -u macos-build.keychain
          security import "$cert" -k ~/Library/Keychains/macos-build.keychain -P '${{ secrets.MACOS_DEV_CERTIFICATE_PWD }}' -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions macos-build.keychain

          codesign --force --options runtime --timestamp -s 'Developer ID Application: Randy McMillan (M684FYCYG6)' "$bin"
          codesign -v "$bin" --verbose

          xcrun notarytool submit "$bin" --force --wait \
            --apple-id '${{ secrets.APPLE_ID }}' \
            --password '${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}' \
            --team-id '${{ secrets.APPLE_TEAM_ID }}'

          xcrun stapler staple "$bin"
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.final-artifact-name }}
          path: |
            ${{ steps.locate.outputs.distrib }}/
            ${{ steps.locate.outputs.bin }}
