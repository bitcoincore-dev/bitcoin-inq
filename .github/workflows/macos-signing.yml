name: macos-signing

on:
  workflow_call:
    inputs:
      raw-artifact-name:
        required: true
        type: string
      final-artifact-name:
        required: true
        type: string
      target-triple:
        required: true
        type: string
    secrets:
      MACOS_DEV_CERTIFICATE:
        required: true
      MACOS_DEV_CERTIFICATE_PWD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true

jobs:
  sign:
    runs-on: macos-14
    steps:
      - name: Download raw artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.raw-artifact-name }}
      - name: Locate signing inputs
        id: locate
        shell: bash
        run: |
          root="${{ steps.download.outputs.download-path }}"
          bin="$(find "$root" -type f -path '*/dist/bitcoin-inq' -print -quit)"
          distrib="$(find "$root" -type d -name distrib -print -quit)"
          if [ -z "$bin" ] || [ -z "$distrib" ]; then
            echo "::error title=Downloaded artifact layout unexpected::Unable to locate signing inputs under $root"
            find "$root" -maxdepth 6 -print | sort
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "distrib=$distrib" >> "$GITHUB_OUTPUT"
      - name: Sign & Notarize Binary
        uses: lando/code-sign-action@v3
        with:
          file: ${{ steps.locate.outputs.bin }}
          certificate-data: ${{ secrets.MACOS_DEV_CERTIFICATE }}
          certificate-id: M684FYCYG6
          certificate-password: ${{ secrets.MACOS_DEV_CERTIFICATE_PWD }}
          apple-notary-user: ${{ secrets.APPLE_ID }}
          apple-notary-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.final-artifact-name }}
          path: |
            ${{ steps.locate.outputs.distrib }}/
            ${{ steps.locate.outputs.bin }}
