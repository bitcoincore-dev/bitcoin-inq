name: macos-signing

on:
  workflow_call:
    inputs:
      raw-artifact-name:
        required: true
        type: string
      final-artifact-name:
        required: true
        type: string
      target-triple:
        required: true
        type: string
    secrets:
      MACOS_DEV_CERTIFICATE:
        required: true
      MACOS_DEV_CERTIFICATE_PWD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true

jobs:
  sign:
    runs-on: macos-14
    steps:
      - name: Download raw artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.raw-artifact-name }}
          path: artifacts
      - name: Locate signing inputs
        id: locate
        shell: bash
        run: |
          root="artifacts"
          pwd
          ls -la "$root" || true
          find "$root" -maxdepth 8 -print | sort || true
          bin="$(find "$root" -type f -path '*/dist/bitcoin-inq' -print -quit)"
          distrib="$(find "$root" -type d -name distrib -print -quit)"
          if [ -z "$bin" ] || [ -z "$distrib" ]; then
            echo "::error title=Downloaded artifact layout unexpected::Unable to locate signing inputs under $root"
            exit 1
          fi
          ls -la "$bin"
          ls -la "$distrib"
          stat "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "distrib=$distrib" >> "$GITHUB_OUTPUT"
      - name: Sign & Notarize Binary
        shell: bash
        run: |
          set -euo pipefail
          bin="${{ steps.locate.outputs.bin }}"
          target_triple="${{ inputs.target-triple }}"
          cert="$RUNNER_TEMP/signcert.p12"

          printf '%s' '${{ secrets.MACOS_DEV_CERTIFICATE }}' | base64 --decode > "$cert"

          security create-keychain -p actions macos-build.keychain
          security default-keychain -s macos-build.keychain
          security unlock-keychain -p actions macos-build.keychain
          security set-keychain-settings -t 3600 -u macos-build.keychain
          security import "$cert" -k ~/Library/Keychains/macos-build.keychain -P '${{ secrets.MACOS_DEV_CERTIFICATE_PWD }}' -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions macos-build.keychain

          signing_identity="$(security find-identity -v -p codesigning ~/Library/Keychains/macos-build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$signing_identity" ]; then
            echo "::error title=Unable to determine Apple signing identity::Imported certificate did not expose a Developer ID identity"
            security find-identity -v -p codesigning ~/Library/Keychains/macos-build.keychain || true
            exit 1
          fi
          team_id="$(printf '%s\n' "$signing_identity" | sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p')"
          if [ -z "$team_id" ]; then
            team_id='${{ secrets.APPLE_TEAM_ID }}'
          fi

          echo "Using signing identity: $signing_identity"
          echo "Using Apple team ID: $team_id"

          codesign --force --options runtime --timestamp -s "$signing_identity" "$bin"
          codesign -v "$bin" --verbose

          if ! xcrun notarytool submit "$bin" --force --wait \
            --apple-id '${{ secrets.APPLE_ID }}' \
            --password '${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}' \
            --team-id "$team_id"; then
            echo "::warning title=Notarization team ID rejected::Retrying without --team-id"
            xcrun notarytool submit "$bin" --force --wait \
              --apple-id '${{ secrets.APPLE_ID }}' \
              --password '${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}'
          fi

          tarball="$(find "${{ steps.locate.outputs.distrib }}" -maxdepth 1 -type f -name '*.tar.xz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "::error title=Unable to locate macOS release tarball::Could not find a tar.xz archive in the release tree for ${target_triple}"
            exit 1
          fi

          workdir="$(mktemp -d)"
          tar -xJf "$tarball" -C "$workdir"
          archive_root="$(find "$workdir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          packaged_bin="$(find "$archive_root" -type f -path '*/bitcoin-inq' -print -quit)"
          if [ -z "$archive_root" ] || [ -z "$packaged_bin" ]; then
            echo "::error title=Unable to locate packaged macOS binary::Could not find bitcoin-inq inside $tarball"
            rm -rf "$workdir"
            exit 1
          fi

          cp -p "$bin" "$packaged_bin"
          codesign -v "$packaged_bin" --verbose

          tar -cJf "$tarball" -C "$workdir" "$(basename "$archive_root")"
          (
            cd "${{ steps.locate.outputs.distrib }}"
            shasum -a 256 "$(basename "$tarball")" > "$(basename "$tarball").sha256"
          )
          rm -rf "$workdir"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.final-artifact-name }}
          path: |
            ${{ steps.locate.outputs.distrib }}/
            ${{ steps.locate.outputs.bin }}
