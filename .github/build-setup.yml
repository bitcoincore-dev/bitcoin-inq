# Signing and notarizing macOS binaries in GitHub Actions requires three parts:
# 1. Store Apple Developer credentials safely in GitHub Secrets.
# 2. Decode/import the signing certificate into a temporary keychain.
# 3. Run `codesign` and `xcrun notarytool` during the workflow run.
#
# Required secrets:
# - MACOS_DEV_CERTIFICATE: Base64-encoded .p12 certificate
# - MACOS_DEV_CERTIFICATE_PWD: Password used when exporting the .p12 file
# - APPLE_ID: Apple Developer account email address
# - APPLE_TEAM_ID: 10-character Apple Developer Team ID (used as a fallback if
#   the imported certificate does not expose its team ID)
# - APPLE_APP_SPECIFIC_PASSWORD: App-specific password from appleid.apple.com
#
# This hook only imports the certificate for cargo-dist builds; the workflow
# step that signs the binary should invoke the actual signing/notarization tools.
- name: Import Signing Certificate
  if: ${{ runner.os == 'macOS' }}
  uses: apple-actions/import-codesign-certs@v3
  with:
    p12-file-base64: ${{ secrets.MACOS_DEV_CERTIFICATE }}
    p12-password: ${{ secrets.MACOS_DEV_CERTIFICATE_PWD }}
